[theme]
theme = "ctp-mocha"

[icons]
icons = "material-nf"

[[block]]
block = "net"
format = " $icon {$ssid|} {$signal_strength|} $ip "
format_alt = " $icon $ip ($device) "
missing_format = ""

[[block]]
block = "battery"
format = " $icon $percentage {$time |}"
charging_format = " $icon $percentage CHR "
full_format = " $icon FULL "
empty_format = " $icon EMPTY "

[[block]]
block = "backlight"
format = " $icon $brightness "

[[block]]
block = "sound"
format = " $icon {$volume.eng(w:2) |muted }"

[[block]]
block = "disk_space"
path = "/"
format = " $icon $available "
warning = 20.0
alert = 10.0

[[block]]
block = "cpu"
format = " $icon $utilization "

[[block]]
block = "memory"
format = " $icon $mem_used_percents "

[[block]]
block = "time"
format = " $icon $timestamp.datetime(f:'%Y-%m-%d %H:%M') "
interval = 60
