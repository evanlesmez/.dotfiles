[window]
opacity = 0.90
startup_mode = "Maximized"
decorations = "None"

[font]
size=14.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[general]
import = [
  "~/.config/alacritty/themes/themes/tomorrow_night_bright.toml"
]


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
