[window]
opacity = 0.975
startup_mode = "Maximized"
decorations = "None"
resize_increments = true
# i3 tiling can't size the window to a whole number of cells, so ~23px is always
# left over; spread it evenly top/bottom instead of piling it under the tmux bar
dynamic_padding = true

[window.padding]
x = 4
y = 0

[font]
size=11.0

[font.normal]
family = "IoskeleyMonoTerm Nerd Font"
style = "Regular"

[general]
import = [
  "~/.config/alacritty/themes/themes/tokyo_night_storm.toml"
]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
