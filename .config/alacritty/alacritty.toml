[window]
opacity = 0.98
startup_mode = "Maximized"
decorations = "None"

[font]
size=12.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[general]
import = [
  "~/.config/alacritty/themes/themes/tomorrow_night_bright.toml"
]

